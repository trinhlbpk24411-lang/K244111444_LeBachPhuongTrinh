<p style="color: red;">{{ errMessage }}</p>

<table border="1" style="border-collapse: collapse; width: 100%;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th style="padding: 6px;">Id</th>
      <th style="padding: 6px;">Name</th>
      <th style="padding: 6px;">Email</th>
      <th style="padding: 6px;">Age</th>
      <th style="padding: 6px;">#</th>
    </tr>
  </thead>

  <!-- Sửa chỗ này: Thêm dấu * phía trước ngFor -->
  <tbody *ngFor="let group of customerGroups">
    <!-- Dòng hiển thị loại nhóm khách hàng -->
    <tr style="background-color: #ffffff; font-weight: bold;">
      <td colspan="5" style="padding: 6px 12px; text-align: left;">
        {{ group.CustomerTypeId }} - {{ group.CustomerTypeName }}
      </td>
    </tr>

    <!-- Dòng hiển thị từng khách hàng -->
    <tr *ngFor="let c of group.Customers">
      <td style="padding: 8px; text-align: center; vertical-align: middle;">{{ c.Id }}</td>
      <td style="padding: 8px; vertical-align: middle;">{{ c.Name }}</td>
      <td style="padding: 8px; vertical-align: middle;">{{ c.Email }}</td>
      <td style="padding: 8px; text-align: center; vertical-align: middle;">{{ c.Age }}</td>
      <td style="padding: 6px; text-align: center; vertical-align: middle;">
        <img [src]="c.Image" width="150" height="110" style="object-fit: cover; display: block; margin: 0 auto;" />
      </td>
    </tr>
  </tbody>
</table>
