<p>service-catalog-image-event works!</p>
<table border="1" style="border-collapse: collapse; margin-bottom: 20px;">
  <tr>
    <th>Ma Danh Muc</th>
    <th>Ten Danh Muc</th>
  </tr>

  <ng-container *ngFor="let cate of categories">
    <!-- Dòng hiển thị mã danh mục và tên danh mục -->
    <tr>
      <td>{{ cate.Cateid }}</td>
      <td>{{ cate.CateName }}</td>
    </tr>

    <!-- Dòng chứa bảng sản phẩm lồng bên trong (gộp 2 cột) -->
    <tr>
      <td colspan="2">
        <table border="1" style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr>
              <th>Ma San Pham</th>
              <th>Ten San Pham</th>
              <th>Gia San Pham</th>
              <th>Picture</th>
            </tr>
          </thead>
          <tbody>
            <!-- Vòng lặp lồng nhau duyệt qua các sản phẩm của từng danh mục -->
            <tr *ngFor="let p of cate.Products">
              <td>{{ p.ProductId }}</td>
              <td>{{ p.ProductName }}</td>
              <td>{{ p.Price }}</td>
              <td>
                <img [src]="p.Image" style="width: 60px; height: 60px; object-fit: contain;">
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </ng-container>
</table>
